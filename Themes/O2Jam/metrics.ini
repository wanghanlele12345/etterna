; O2Jam: Rebirth with a hand-inked comic gameplay screen.
; Everything except the gameplay screen falls back to Rebirth.
; The screen is 960x720 (4:3). Pixel values match Scripts/90 O2Jam.lua:
;   lanes are 48px wide (the 64px noteskin columns at zoom 0.75), the lane field starts at x=30,
;   so its centre is x=198; the receptors sit 570px from the top.
[Global]
FallbackTheme=Rebirth

[ScreenGameplay]
PlayerInitCommand=x,198;y,SCREEN_CENTER_Y;zoom,0.75
; the stock life bar is replaced by the energy column in the HUD
LifeP1OnCommand=visible,false
; lead-in before the first note: the engine default is 6s before the first step and 2s before the
; music starts, which is a long wait on charts that open early; notes need about 1.5s to fall
MinSecondsToStep=3.0
MinSecondsToMusic=1.0

[Player]
; local to the player: SCREEN_CENTER_Y + 280 * 0.75 = 570
ReceptorArrowsYStandard=-280
ReceptorArrowsYReverse=280
HoldJudgmentYStandard=-200
HoldJudgmentYReverse=200
DrawDistanceBeforeTargetsPixels=SCREEN_HEIGHT*1.4

[NoteField]
; beat lines scrolling down the lanes give the dance a visible pulse
ShowBeatBars=true
BarMeasureAlpha=0.6
Bar4thAlpha=0.2
Bar8thAlpha=0
Bar16thAlpha=0
